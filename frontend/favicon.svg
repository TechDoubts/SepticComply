<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" role="img">
  <title>SepticComply Favicon</title>
  <desc>Minimal septic tank with checkmark — favicon for SepticComply</desc>
  
  <!-- Shield background -->
  <path d="M16 2 L29 8 V22 C29 27.3 16 30 16 30 C16 30 3 27.3 3 22 V8 L16 2 Z" 
        fill="#1B2A4A" 
        stroke="none"/>
  
  <!-- Tank body -->
  <path d="M16 9 L21 9 L21 20 C21 22.5 16 24 16 24 C16 24 11 22.5 11 20 L11 9 Z" 
        fill="none" 
        stroke="#059669" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Tank access hatch -->
  <ellipse cx="16" cy="11" rx="4" ry="2" 
           fill="none" 
           stroke="#059669" 
           stroke-width="1.2" 
           stroke-linecap="round"/>
  
  <!-- Hatch center -->
  <circle cx="16" cy="11" r="1" fill="#059669"/>
  
  <!-- Checkmark -->
  <path d="M11 16 L15 20 L21 13" 
        fill="none" 
        stroke="#059669" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>